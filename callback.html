<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Connected - ClipBot</title><style>body{font-family:system-ui,"Segoe UI",sans-serif;max-width:720px;margin:40px auto;padding:0 20px;line-height:1.6;color:#1b2430;background:#f6f7f9}
h1{font-size:28px}a{color:#2e62d9}
.box{background:#fff;border:1px solid #d4d9df;border-radius:10px;padding:16px;word-break:break-all;font-family:Consolas,monospace;font-size:14px}
button{font:inherit;font-weight:700;padding:10px 18px;border-radius:8px;border:0;background:#1b2430;color:#fff;cursor:pointer;margin-top:12px}</style></head><body>
<h1>Almost done</h1>
<p>Copy this whole address and paste it into ClipBot:</p>
<div class="box" id="url"></div>
<button id="copy">Copy</button> <span id="done"></span>
<script>
document.getElementById("url").textContent = location.href;
document.getElementById("copy").onclick = async () => {
  try { await navigator.clipboard.writeText(location.href); document.getElementById("done").textContent = "Copied! Paste it into ClipBot."; }
  catch (e) { document.getElementById("done").textContent = "Select the text above and press Ctrl+C."; }
};
</script>
</body></html>
